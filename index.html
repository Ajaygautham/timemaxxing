<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Todo List</title>
    <!-- Embedded SVG Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%2318181b'/><path d='M28 52L42 66L72 34' stroke='%2322c55e' stroke-width='10' stroke-linecap='round' stroke-linejoin='round' fill='none'/><circle cx='72' cy='34' r='3' fill='%234ade80'/></svg>">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Supabase JS Client Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            400: '#4ade80',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #18181b;
        }
        ::-webkit-scrollbar-thumb {
            background: #27272a;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3f3f46;
        }
        .task-item {
            transition: all 0.2s ease-in-out;
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex items-center justify-center p-4 sm:p-6">

    <main class="w-full max-w-md bg-zinc-900 border border-zinc-800 rounded-2xl shadow-2xl p-6 sm:p-8">
        
        <!-- Header -->
        <div class="mb-6">
            <h1 class="text-2xl font-semibold tracking-tight text-zinc-100">Tasks</h1>
            <p id="task-counter" class="text-sm text-zinc-400 mt-1">0 tasks remaining</p>
        </div>

        <form id="todo-form" class="flex gap-2 mb-6">
            <input 
                type="text" 
                id="todo-input" 
                placeholder="What needs to be done?" 
                autocomplete="off"
                class="flex-1 bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-zinc-100 placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-all"
            >
            <button 
                type="submit" 
                class="bg-brand-500 hover:bg-brand-600 active:scale-95 text-zinc-950 font-semibold px-5 py-3 rounded-xl text-sm transition-all flex items-center justify-center shadow-lg shadow-brand-500/10"
            >
                Add
            </button>
        </form>

        <div class="space-y-4">
            <!-- Filter Tabs -->
            <div class="flex items-center justify-between border-b border-zinc-800 pb-3 text-xs font-medium text-zinc-400">
                <div class="flex gap-4">
                    <button data-filter="all" class="filter-btn text-brand-400 font-semibold transition-colors">All</button>
                    <button data-filter="active" class="filter-btn hover:text-zinc-200 transition-colors">Active</button>
                    <button data-filter="completed" class="filter-btn hover:text-zinc-200 transition-colors">Completed</button>
                </div>
                <button id="clear-completed" class="hover:text-zinc-200 transition-colors">Clear completed</button>
            </div>

            <!-- Task List -->
            <ul id="todo-list" class="divide-y divide-zinc-800/60 max-h-[360px] overflow-y-auto pr-1">
                <!-- Dynamically populated from Supabase -->
            </ul>

            <!-- Empty State -->
            <div id="empty-state" class="hidden text-center py-12">
                <div class="w-12 h-12 rounded-full bg-zinc-800/60 text-zinc-500 flex items-center justify-center mx-auto mb-3">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 022 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path>
                    </svg>
                </div>
                <p class="text-sm font-medium text-zinc-300">No tasks found</p>
                <p class="text-xs text-zinc-500 mt-0.5">Add a new task above to get started.</p>
            </div>
        </div>

    </main>

    <script>
        // Supabase configuration
        const SUPABASE_URL = 'https://bpugckrdtegogymsvkbs.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJwdWdja3JkdGVnb2d5bXN2a2JzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4NTQ4NzAsImV4cCI6MjEwNjQzMDg3MH0.aYJaw1uron7nkP9mfOYLEOqen_eRSm_c24HLTeq7h4A';

        // Use supabaseClient to prevent name collision with window.supabase
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.addEventListener('DOMContentLoaded', () => {
            const todoForm = document.getElementById('todo-form');
            const todoInput = document.getElementById('todo-input');
            const todoList = document.getElementById('todo-list');
            const taskCounter = document.getElementById('task-counter');
            const emptyState = document.getElementById('empty-state');
            const clearCompletedBtn = document.getElementById('clear-completed');
            const filterBtns = document.querySelectorAll('.filter-btn');

            let tasks = [];
            let currentFilter = 'all';

            // Fetch tasks from Supabase database
            async function fetchTasks() {
                const { data, error } = await supabaseClient
                    .from('todos')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) {
                    console.error('Error fetching tasks:', error);
                    return;
                }

                tasks = data || [];
                updateUI();
            }

            // Update remaining task counter and empty state
            function updateUI() {
                const remaining = tasks.filter(t => !t.completed).length;
                taskCounter.textContent = `${remaining} task${remaining === 1 ? '' : 's'} remaining`;

                const filteredTasks = tasks.filter(task => {
                    if (currentFilter === 'active') return !task.completed;
                    if (currentFilter === 'completed') return task.completed;
                    return true;
                });

                if (filteredTasks.length === 0) {
                    todoList.innerHTML = '';
                    emptyState.classList.remove('hidden');
                } else {
                    emptyState.classList.add('hidden');
                    renderTasks(filteredTasks);
                }
            }

            // Render task list items
            function renderTasks(tasksToRender) {
                todoList.innerHTML = '';
                tasksToRender.forEach(task => {
                    const li = document.createElement('li');
                    li.className = 'task-item flex items-center justify-between py-3.5 group';
                    
                    li.innerHTML = `
                        <label class="flex items-center gap-3 cursor-pointer flex-1 min-w-0 pr-3">
                            <input 
                                type="checkbox" 
                                ${task.completed ? 'checked' : ''} 
                                data-id="${task.id}"
                                class="task-checkbox w-4 h-4 rounded border-zinc-700 bg-zinc-950 text-brand-500 focus:ring-brand-500 focus:ring-offset-zinc-900 accent-brand-500 cursor-pointer"
                            >
                            <span class="text-sm truncate transition-colors ${task.completed ? 'line-through text-zinc-500' : 'text-zinc-200'}">${escapeHTML(task.text)}</span>
                        </label>
                        <button 
                            data-id="${task.id}" 
                            class="delete-btn opacity-0 group-hover:opacity-100 text-zinc-500 hover:text-red-400 p-1.5 rounded-lg transition-all"
                            title="Delete task"
                        >
                            <svg class="w-4 h-4 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                            </svg>
                        </button>
                    `;
                    todoList.appendChild(li);
                });
            }

            function escapeHTML(str) {
                return str.replace(/[&<>'"]/g, 
                    tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
                );
            }

            // Add new task
            todoForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const text = todoInput.value.trim();
                if (!text) return;

                todoInput.value = '';

                const { data, error } = await supabaseClient
                    .from('todos')
                    .insert([{ text, completed: false }])
                    .select();

                if (error) {
                    console.error('Error adding task:', error);
                } else if (data) {
                    tasks.unshift(data[0]);
                    updateUI();
                }
            });

            // Toggle checkbox or delete item via event delegation
            todoList.addEventListener('click', async (e) => {
                const checkbox = e.target.closest('.task-checkbox');
                const deleteBtn = e.target.closest('.delete-btn');

                if (checkbox) {
                    const id = checkbox.dataset.id;
                    const task = tasks.find(t => t.id === id);
                    if (task) {
                        const newStatus = checkbox.checked;
                        task.completed = newStatus;
                        updateUI();

                        const { error } = await supabaseClient
                            .from('todos')
                            .update({ completed: newStatus })
                            .eq('id', id);

                        if (error) {
                            console.error('Error updating task:', error);
                            task.completed = !newStatus;
                            updateUI();
                        }
                    }
                }

                if (deleteBtn) {
                    const id = deleteBtn.dataset.id;
                    tasks = tasks.filter(t => t.id !== id);
                    updateUI();

                    const { error } = await supabaseClient
                        .from('todos')
                        .delete()
                        .eq('id', id);

                    if (error) {
                        console.error('Error deleting task:', error);
                        fetchTasks();
                    }
                }
            });

            // Filter button switching
            filterBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    filterBtns.forEach(b => b.classList.remove('text-brand-400', 'font-semibold'));
                    filterBtns.forEach(b => b.classList.add('text-zinc-400'));
                    
                    e.target.classList.remove('text-zinc-400');
                    e.target.classList.add('text-brand-400', 'font-semibold');

                    currentFilter = e.target.dataset.filter;
                    updateUI();
                });
            });

            // Clear completed tasks
            clearCompletedBtn.addEventListener('click', async () => {
                const completedIds = tasks.filter(t => t.completed).map(t => t.id);
                if (completedIds.length === 0) return;

                tasks = tasks.filter(t => !t.completed);
                updateUI();

                const { error } = await supabaseClient
                    .from('todos')
                    .delete()
                    .in('id', completedIds);

                if (error) {
                    console.error('Error clearing completed tasks:', error);
                    fetchTasks();
                }
            });

            // Initial load
            fetchTasks();
        });
    </script>
</body>
</html>
